version: 0.2

phases:
  install:
    commands:
      - pip install "tox < 4.0"
    runtime-versions:
      python: latest
  pre_build:
    commands:
      - pyenv install --skip-existing 3.8.12
      - pyenv local 3.8.12
      - pip install "tox < 4.0"
  build:
    commands:
      - NUM_RETRIES=3
      - |
        while [ $NUM_RETRIES -gt 0 ]
        do
          # basic usability smoke test
          pip install --force-reinstall "aws-encryption-sdk==$VERSION" && python -c "import aws_encryption_sdk; from aws_encryption_sdk import StrictAwsKmsMasterKeyProvider"
          if [ $? -eq 0 ]; then
            break
          fi
          NUM_RETRIES=$((NUM_RETRIES-1))
          if [ $NUM_RETRIES -eq 0 ]; then
            echo "All validation attempts failed, stopping"
            exit 1;
          else
            echo "Validation failed, retrying in 60 seconds; will retry $NUM_RETRIES more times" && sleep 60
          fi
        done
