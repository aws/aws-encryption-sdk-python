version: 0.2

phases:
  install:
    runtime-versions:
      python: latest
    commands:
      - python -m pip install --upgrade pip
  build:
    commands:
      - NUM_RETRIES=3
      - |
        while [ $NUM_RETRIES -gt 0 ]
        do
          pip install "aws-encryption-sdk==$VERSION" \
            && python -c "import aws_encryption_sdk; \
                          from aws_encryption_sdk import StrictAwsKmsMasterKeyProvider; \
                          print('aws-encryption-sdk', aws_encryption_sdk.__version__, 'installed and imports cleanly')"
          if [ $? -eq 0 ]; then
            break
          fi
          NUM_RETRIES=$((NUM_RETRIES-1))
          if [ $NUM_RETRIES -eq 0 ]; then
            echo "All validation attempts failed, stopping"
            exit 1;
          else
            echo "Validation failed, retrying in 60 seconds; will retry $NUM_RETRIES more times" && sleep 60
          fi
        done
