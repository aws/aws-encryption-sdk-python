name: Continuous Integration tests for the test vector handler

on:
  workflow_call:
    # Define any secrets that need to be passed from the caller
    secrets:
      INTEG_AWS_ACCESS_KEY_ID:
        required: true
      INTEG_AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  tests:
    # Leaving this defined but disabled
    # until we address the credentials problem.
    if: 1 == 0
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          # runs on macos-15-intel as macos-latest does not work in all python versions. 
          - macos-15-intel
        python:
          - 3.8
          - 3.x
        architecture:
          - x64
          - x86
        category:
          - awses_1.3.3
          - awses_1.3.max
          - awses_latest
        exclude:
          # x86 builds are only meaningful for Windows
          - os: ubuntu-latest
            architecture: x86
          - os: macos-latest
            architecture: x86
        include:
          - os: ubuntu-latest
            runner: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-python-${{ github.run_id }}-${{ github.run_attempt }}
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: macos-latest
          - os: macos-15-intel
            runner: macos-15-intel
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.INTEG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INTEG_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r dev_requirements/ci-requirements.txt
      - name: run test
        env:
          TOXENV: ${{ matrix.category }}
        run: |
          cd test_vector_handlers
          tox -- -vv
  static-analysis:
    runs-on: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-python-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        category:
          - bandit
          - readme
          - flake8
          - pylint
          - flake8-tests
          - pylint-tests
    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v4
          with:
            python-version: '3.10'
        - run: |
            python -m pip install --upgrade pip
            pip install --upgrade -r dev_requirements/ci-requirements.txt
        - name: run test
          env:
            TOXENV: ${{ matrix.category }}
          run: |
            cd test_vector_handlers
            tox -- -vv
